
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title>Text to JSON</title>

  <style>
    body {
      max-width: 700px;
      margin: 40px auto;
      padding: 20px;
      font-family: Arial, sans-serif;
      background: #f3f5f8;
      color: #222;
    }

    main {
      background: white;
      padding: 24px;
      border-radius: 12px;
    }

    textarea, input {
      box-sizing: border-box;
      width: 100%;
      padding: 12px;
      margin: 8px 0 16px;
      border: 1px solid #ccc;
      border-radius: 6px;
    }

    textarea {
      min-height: 140px;
      resize: vertical;
    }

    button {
      padding: 12px 22px;
      background: #1769e0;
      color: white;
      border: 0;
      border-radius: 6px;
      cursor: pointer;
    }

    button:disabled {
      opacity: .6;
      cursor: wait;
    }

    pre {
      background: #f0f2f5;
      padding: 12px;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }

    .hint {
      color: #555;
      font-size: .9rem;
    }
  </style>
</head>

<body>
<main>
  <h1>Text to JSON</h1>
  <p>Enter your text and submit it to update the JSON file.</p>

  <form id="form">
    <label for="message">Message</label>
    <textarea
      id="message"
      maxlength="5000"
      required
      placeholder="Enter your text here"
    ></textarea>

    <label for="password">Write password</label>
    <input
      id="password"
      type="password"
      maxlength="256"
      autocomplete="current-password"
      required
    >

    <p class="hint">
      Use only information that is safe to publish publicly.
    </p>

    <button id="send" type="submit">Send</button>
  </form>

  <p id="status" role="status" aria-live="polite"></p>

  <h2>Latest JSON</h2>
  <pre id="output">Loading...</pre>
</main>

<script>
  "use strict";

  const WORKER_URL =
    "https://text-json-bridge.shibinkodoth1.workers.dev";

  const form = document.getElementById("form");
  const messageInput = document.getElementById("message");
  const passwordInput = document.getElementById("password");
  const sendButton = document.getElementById("send");
  const status = document.getElementById("status");
  const output = document.getElementById("output");

  async function loadJson() {
    try {
      const response = await fetch(
        `${WORKER_URL}/latest`,
        { cache: "no-store" }
      );

      if (!response.ok) {
        throw new Error("Unable to load the latest JSON.");
      }

      const data = await response.json();

      // Use textContent so JSON content is not interpreted as HTML.
      output.textContent = JSON.stringify(data, null, 2);
    } catch {
      output.textContent = "Could not load the latest JSON.";
    }
  }

  form.addEventListener("submit", async (event) => {
    event.preventDefault();

    const message = messageInput.value.trim();
    const password = passwordInput.value;

    if (!message || message.length > 5000 || !password) {
      status.textContent = "Enter a message and your write password.";
      return;
    }

    sendButton.disabled = true;
    status.textContent = "Submitting...";

    try {
      const response = await fetch(WORKER_URL, {
        method: "POST",
        headers: {
          "Content-Type": "application/json"
        },
        body: JSON.stringify({ message, password })
      });

      const result = await response.json();

      if (!response.ok || !result.success) {
        throw new Error(
          result.error || "Submission failed. Please try again."
        );
      }

      status.textContent = "Saved successfully.";
      messageInput.value = "";
      passwordInput.value = "";

      await loadJson();
    } catch {
      status.textContent =
        "Submission failed. Check your connection and try again.";
    } finally {
      sendButton.disabled = false;
    }
  });

  loadJson();
</script>
</body>
</html>
